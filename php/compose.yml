services:
  php:
    build:
      context: ./web
    ports:
      - "80:80"
    volumes:
      - ./web:/var/www/html
  maria:
    build:
      context: ./db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurante
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
volumes:
  mariadb_data:
