<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar plato</title>
</head>
<body>
<div th:replace="~{components/nav :: nav}"></div>
<h1>Editar plato</h1>
<form method="post" th:action="@{/platos/actualizar}">
    <input type="hidden" name="nombre_original" th:value="${plato.nombre}">
    <label for="nombre">Nombre:</label>
    <input id="nombre" type="text" name="nombre" th:value="${plato.nombre}" required>
    <label for="tipo">Tipo:</label>
    <select id="tipo" name="tipo" required>
        <option value="">Seleccione un tipo</option>
        <option value="primero" th:selected="${plato.tipo == 'primero'}">Primero</option>
        <option value="segundo" th:selected="${plato.tipo == 'segundo'}">Segundo</option>
        <option value="postre" th:selected="${plato.tipo == 'postre'}">Postre</option>
    </select>
    <label for="precio">Precio:</label>
    <input id="precio" type="number" name="precio" step="0.01" min="0" th:value="${plato.precio}" required>
    <fieldset>
        <legend>Ingredientes:</legend>
        <div th:each="ingrediente : ${ingredientes}">
            <input type="checkbox" name="ingredientes" th:id="${'ingrediente-' + ingrediente.nombre}"
                   th:value="${ingrediente.nombre}"
                   th:checked="${#lists.contains(ingredientesSeleccionados, ingrediente.nombre)}">
            <label th:for="${'ingrediente-' + ingrediente.nombre}" th:text="${ingrediente.nombre}"></label>
        </div>
    </fieldset>
    <button type="submit">Guardar</button>
</form>
</body>
</html>
